name: Publish reviewed Beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'mhimt-lab/illustrator-studio-mcp' && startsWith(github.ref, 'refs/tags/v0.1.0-beta.')
    environment: beta-publication
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Rebuild the exact reviewed tarball outside the snapshot
        run: node scripts/release-artifact.mjs --skip-build --expect-tag "$GITHUB_REF_NAME" --out-dir "$RUNNER_TEMP/beta-artifact"
      - name: Rebuild the reviewed Claude Desktop extension from that tarball
        run: node scripts/build-mcpb.mjs --tarball "$RUNNER_TEMP"/beta-artifact/*.tgz --out-dir "$RUNNER_TEMP/beta-artifact" --record
      - name: Verify previously reviewed manifest and artifact
        run: node scripts/verify-beta-publication.mjs "$RUNNER_TEMP/beta-artifact" "$GITHUB_REF_NAME"
      - run: node scripts/release-verify.mjs --release-dir "$RUNNER_TEMP/beta-artifact" --handshake require
      # npm trusted publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0
      # (https://docs.npmjs.com/trusted-publishers). The checks above stay on Node 20, the users' minimum.
      - name: Switch to a Node release that supports trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Use pinned npm with trusted publishing support
        run: npm install -g npm@11.5.1
      - name: Publish only the reviewed Beta tarball
        run: npm publish "$RUNNER_TEMP"/beta-artifact/*.tgz --tag beta --access public --provenance
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --latest=false \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/beta-artifact/RELEASE_NOTES.md" \
            "$RUNNER_TEMP"/beta-artifact/*.tgz "$RUNNER_TEMP"/beta-artifact/*.mcpb "$RUNNER_TEMP/beta-artifact/SHA256SUMS"
