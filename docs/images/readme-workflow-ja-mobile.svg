<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">あなたの言葉から、Illustratorの編集へ。</title><desc id="desc">利用の流れを示す図。実際の操作画面ではありません。</desc><rect width="600" height="480" rx="20" fill="#f5f3ee"/><g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif">
<text x="24" y="48" font-size="26" font-weight="700" fill="#24342e">あなたの言葉から、Illustratorの編集へ。</text>
<rect x="24" y="72" width="552" height="106" rx="14" fill="#fff"/><text x="46" y="118" font-size="24" font-weight="700" fill="#58665e">01</text><text x="104" y="117" font-size="34" font-weight="700" fill="#24342e">伝える</text><text x="104" y="152" font-size="23" fill="#58665e">変えたいところを言葉に</text>
<rect x="24" y="192" width="552" height="106" rx="14" fill="#fff"/><text x="46" y="238" font-size="24" font-weight="700" fill="#58665e">02</text><text x="104" y="237" font-size="34" font-weight="700" fill="#24342e">計画を確認</text><text x="104" y="272" font-size="23" fill="#58665e">対象と変更内容を確かめる</text>
<rect x="24" y="312" width="552" height="106" rx="14" fill="#263e34"/><text x="46" y="358" font-size="24" font-weight="700" fill="#d9e8d8">03</text><text x="104" y="357" font-size="34" font-weight="700" fill="#fff">実行・検証</text><text x="104" y="392" font-size="23" fill="#d9e8d8">Illustratorの結果を読み直す</text>
<text x="24" y="452" font-size="20" fill="#58665e">利用イメージ・実際の操作画面ではありません</text></g></svg>
