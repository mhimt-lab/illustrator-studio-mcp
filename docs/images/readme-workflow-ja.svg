<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">あなたの言葉から、Illustratorの編集へ。</title><desc id="desc">指示を伝え、変更計画を確認してから、AIが実行して結果を検証する利用の流れ。操作画面や実績を示すものではありません。</desc>
<rect width="1200" height="370" rx="24" fill="#f5f3ee"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif">
<text x="42" y="60" font-size="30" font-weight="700" fill="#24342e">あなたの言葉から、Illustratorの編集へ。</text>
<rect x="42" y="94" width="352" height="210" rx="16" fill="#ffffff"/>
<text x="67" y="139" font-size="22" font-weight="700" fill="#58665e">01</text>
<text x="67" y="195" font-size="39" font-weight="700" fill="#24342e">伝える</text>
<text x="67" y="249" font-size="21" fill="#58665e">変えたいところを言葉に</text>
<path d="M401 199h15m-6-6 6 6-6 6" fill="none" stroke="#76887b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="424" y="94" width="352" height="210" rx="16" fill="#ffffff"/>
<text x="449" y="139" font-size="22" font-weight="700" fill="#58665e">02</text>
<text x="449" y="195" font-size="39" font-weight="700" fill="#24342e">計画を確認</text>
<text x="449" y="249" font-size="21" fill="#58665e">対象と変更内容を確かめる</text>
<path d="M783 199h15m-6-6 6 6-6 6" fill="none" stroke="#76887b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="806" y="94" width="352" height="210" rx="16" fill="#263e34"/>
<text x="831" y="139" font-size="22" font-weight="700" fill="#d9e8d8">03</text>
<text x="831" y="195" font-size="39" font-weight="700" fill="#ffffff">実行・検証</text>
<text x="831" y="249" font-size="21" fill="#d9e8d8">Illustratorの結果を読み直す</text>
<text x="42" y="343" font-size="18" fill="#58665e">利用の流れを表した図です。実際の操作画面ではありません。</text></g></svg>
